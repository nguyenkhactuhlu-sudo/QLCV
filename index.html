<html lang="vi">
<head>

  <style>
    body{display:grid;place-items:center;min-height:100vh;margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef5fb;text-align:center;padding:20px}

    .c small{color:#5a738e;font-size:12px;display:block;margin-top:4px}
    .tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:8px}
    .t1{background:#fff0e3;color:#bd651d}
    .t2{background:#e6f4ee;color:#1f7a55}
  </style>
</head>

    <div class="grid">
      <a class="c" href="demo/index.html">
        <span class="tag t1">BAN TRINH DIEN</span>

        <small>Du lieu gia, localStorage, khong can tai khoan, chay offline</small>
